apiVersion: apps/v1
kind: Deployment
metadata:
  name: asciip
  labels:
    app: asciip
spec:
  selector:
    matchLabels:
      app: asciip
  template:
    metadata:
      labels:
        app: asciip
    spec:
      containers:
        - name: asciip
          image: node:26.13.1@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996 # 26.13.1
          ports:
          - containerPort: 3000
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -e
            git clone https://github.com/hhourani27/asciip &&
            cd asciip &&
            npm install &&
            npm start
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
