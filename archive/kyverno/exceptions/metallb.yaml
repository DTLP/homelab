apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: metallb-speaker
  namespace: kube-system
spec:
  policyRefs:
    - name: restrict-scheduling-to-master-nodes
      kind: ValidatingPolicy
    - name: pod-capabilities
      kind: ValidatingPolicy
    - name: disallow-host-network-pods
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: metallb-speaker
      expression: >-
        object.metadata.namespace == 'metallb-system' &&
        'app' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['app'] == 'metallb' &&
        'component' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['component'] == 'speaker'