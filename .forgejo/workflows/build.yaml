name: Build and push

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE: registry.dtlp.cc/library/registry-cache-proxy

jobs:
  build:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" |
            docker login registry.dtlp.cc \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Build
        run: docker build --tag "$IMAGE:sha-${{ github.sha }}" .

      - name: Push
        run: |
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker tag "$IMAGE:sha-${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
