apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/external-dns/kustomize?ref=v0.24.0

patches:
  - path: deployment-patch.yaml
  - patch: |-
      - op: replace
        path: /metadata/name
        value: external-dns
      - op: replace
        path: /subjects/0
        value:
          kind: ServiceAccount
          name: external-dns
          namespace: kube-system
    target:
      kind: ClusterRoleBinding
      name: external-dns-viewer
  - patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - traefik.io
          resources:
            - ingressroutes
            - ingressroutetcps
            - ingressrouteudps
          verbs:
            - get
            - watch
            - list
    target:
      kind: ClusterRole
      name: external-dns

images:
  - name: registry.k8s.io/external-dns/external-dns
    newTag: v0.24.0
    digest: sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
