apiVersion: apps/v1
kind: Deployment
metadata:
  name: calico-kube-controllers
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: calico-kube-controllers
          resources:
            requests:
              cpu: 20m
              memory: 144Mi
            limits:
              cpu: 50m
              memory: 208Mi
