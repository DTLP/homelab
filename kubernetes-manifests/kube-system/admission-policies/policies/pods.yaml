apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-selinux
  annotations:
    policies.kyverno.io/title: Disallow SELinux
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: SELinux options can be used to escalate privileges and should not
      be allowed. This policy ensures that the `seLinuxOptions` field is undefined.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: "object.spec.?securityContext.?seLinuxOptions.?type.orValue('container_t') in ['container_t',\
      \ 'container_init_t', 'container_kvm_t'] && variables.allContainers.all(c, \n  c.?securityContext.?seLinuxOptions.?type.orValue('container_t')\
      \ in ['container_t', 'container_init_t', 'container_kvm_t']\n)"
    message: Setting the SELinux type is restricted. The fields spec.securityContext.seLinuxOptions.type,
      spec.containers[*].securityContext.seLinuxOptions.type, , spec.initContainers[*].securityContext.seLinuxOptions,
      and spec.ephemeralContainers[*].securityContext.seLinuxOptions.type must either be unset or set
      to one of the allowed values (container_t, container_init_t, or container_kvm_t).
  - expression: "object.spec.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&  object.spec.?securityContext.?seLinuxOptions.?role.orValue('')\
      \ == '' && variables.allContainers.all(c, \n  c.?securityContext.?seLinuxOptions.?user.orValue('')\
      \ == '' && \n  c.?securityContext.?seLinuxOptions.?role.orValue('') == ''\n)"
    message: Setting the SELinux user or role is forbidden. The fields spec.securityContext.seLinuxOptions.user,
      spec.securityContext.seLinuxOptions.role, spec.containers[*].securityContext.seLinuxOptions.user,
      spec.containers[*].securityContext.seLinuxOptions.role, spec.initContainers[*].securityContext.seLinuxOptions.user,
      spec.initContainers[*].securityContext.seLinuxOptions.role, spec.ephemeralContainers[*].securityContext.seLinuxOptions.user,
      and spec.ephemeralContainers[*].securityContext.seLinuxOptions.role must be unset.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-capabilities
  annotations:
    policies.kyverno.io/title: Pod Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Adding capabilities other than `NET_BIND_SERVICE` is disallowed.
      Rules with exeptions for particular workloads must be added here. Default rule maps Kubernetes restricted
      pod security standard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  - name: exclude-exceptions
    expression: '!((object.metadata.namespace == ''metallb-system'' && has(object.metadata.labels) &&
      ''app'' in object.metadata.labels && object.metadata.labels[''app''] == ''metallb'' && ''component''
      in object.metadata.labels && object.metadata.labels[''component''] == ''speaker''))'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - message: Any capabilities added other than NET_BIND_SERVICE are disallowed.
    expression: "variables.allContainers.all(c, \n  c.?securityContext.?capabilities.?add.orValue([]).all(cap,\
      \ cap in ['NET_BIND_SERVICE', ''])\n)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-host-ipc-pods
  annotations:
    policies.kyverno.io/title: Disallow HostIPC Pods
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: This policy ensures Pods do not use the host's IPC namespace
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
