apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hostpath-vols
  annotations:
    policies.kyverno.io/title: Limit hostPath Volumes to Specific Directories
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: hostPath volumes consume the underlying node's file system. Mounting
      host paths should be disabled by default, except for specific cases
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  - name: exclude-exceptions
    expression: '!((object.metadata.namespace == ''monitoring'' && has(object.metadata.labels) && ''app.kubernetes.io/name''
      in object.metadata.labels && object.metadata.labels[''app.kubernetes.io/name''] == ''vector''))'
  validations:
  - message: HostPath volumes are not allowed.
    expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow hostPorts
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Access to host ports allows potential snooping of network traffic
      and should not be allowed, or at minimum restricted to a known list. This policy ensures the `hostPort`
      field is unset or set to `0`.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  - name: exclude-exceptions
    expression: '!((object.metadata.namespace == ''metallb-system'' && has(object.metadata.labels) &&
      ''app'' in object.metadata.labels && object.metadata.labels[''app''] == ''metallb'' && ''component''
      in object.metadata.labels && object.metadata.labels[''component''] == ''speaker''))'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - message: Use of host ports is disallowed. The fields spec.containers[*].ports[*].hostPort , spec.initContainers[*].ports[*].hostPort,
      and spec.ephemeralContainers[*].ports[*].hostPort must either be unset or set to `0`.
    expression: "variables.allContainers.all(c, \n  c.?ports.orValue([]).all(p, !has(p.hostPort) || p.hostPort\
      \ == 0)\n)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-scheduling-to-master-nodes
  annotations:
    policies.kyverno.io/title: Restrict scheduling to master nodes
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Scheduling non-system Pods to control plane nodes (which run kubelet)
      is often undesirable because it takes away resources from the control plane components and can represent
      a possible security threat vector. This policy prevents users from setting a toleration in a Pod
      spec which allows running on control plane nodes with the taint key `node-role.kubernetes.io/master`
      or `node-role.kubernetes.io/control-plane`.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-system-namespaces
    expression: "!(\n  request.namespace == 'kube-system' ||\n  request.namespace.startsWith('sys-')\n\
      )"
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  - name: exclude-exceptions
    expression: '!((object.metadata.namespace == ''metallb-system'' && has(object.metadata.labels) &&
      ''app'' in object.metadata.labels && object.metadata.labels[''app''] == ''metallb'' && ''component''
      in object.metadata.labels && object.metadata.labels[''component''] == ''speaker'') || (object.metadata.namespace
      == ''monitoring'' && has(object.metadata.labels) && ''app'' in object.metadata.labels && object.metadata.labels[''app'']
      == ''node-exporter'') || (object.metadata.namespace == ''monitoring'' && has(object.metadata.labels)
      && ''app.kubernetes.io/name'' in object.metadata.labels && object.metadata.labels[''app.kubernetes.io/name'']
      == ''vector''))'
  validations:
  - message: Pods may not use tolerations which schedule on control plane nodes.
    expression: "object.spec.?tolerations.orValue([]).all(t, \n    t.?key.orValue('') != 'node-role.kubernetes.io/master'\
      \ && \n    t.?key.orValue('') != 'node-role.kubernetes.io/control-plane'\n  )"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Privilege escalation, such as via set-user-ID or set-group-ID file
      mode, should not be allowed. This policy ensures the `allowPrivilegeEscalation` field is set to
      `false`.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: "variables.allContainers.all(c, \n  c.?securityContext.?allowPrivilegeEscalation.orValue(false)\
      \ == false\n)"
    messageExpression: '''Privilege escalation is disallowed. The following containers have allowPrivilegeEscalation
      set to true: '' +  variables.allContainers.filter(c, c.?securityContext.?allowPrivilegeEscalation.orValue(false)
      == true).map(c, c.name).join('', '')'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Privileged mode disables most security mechanisms and must not be
      allowed. This policy ensures Pods do not call for privileged mode.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: "variables.allContainers.all(c, \n  c.?securityContext.?privileged.orValue(false) == false\n\
      )"
    messageExpression: '''Privileged mode is disallowed. The following containers have privileged set
      to true: '' +  variables.allContainers.filter(c, c.?securityContext.?privileged.orValue(false) ==
      true).map(c, c.name).join('', '')'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-proc-mount
  annotations:
    policies.kyverno.io/title: Disallow procMount
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: The default /proc masks are set up to reduce attack surface and should
      be required. This policy ensures nothing but the default procMount can be specified. Note that in
      order for users to deviate from the `Default` procMount requires setting a feature gate at the API
      server.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  variables:
  - name: allContainers
    expression: object.spec.?containers.orValue([]) +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: "variables.allContainers.all(c, \n  c.?securityContext.?procMount.orValue('Default') ==\
      \ 'Default'\n)"
    messageExpression: '''Changing the proc mount from the default is not allowed. The following containers
      have an invalid procMount: '' +  variables.allContainers.filter(c, c.?securityContext.?procMount.orValue(''Default'')
      != ''Default'').map(c, c.name).join('', '')'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-sysctls
  annotations:
    policies.kyverno.io/title: Restrict sysctls
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Sysctls can disable security mechanisms or affect all containers
      on a host, and should be disallowed except for an allowed "safe" subset. A sysctl is considered
      safe if it is namespaced in the container or the Pod, and it is isolated from other Pods or processes
      on the same Node. This policy ensures that only those "safe" subsets can be specified in a Pod.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: exclude-kube-system
    expression: object.metadata.namespace != 'kube-system'
  validations:
  - expression: "object.spec.?securityContext.?sysctls.orValue([]).all(s, \n  s.name in [\n    'kernel.shm_rmid_forced',\
      \ \n    'net.ipv4.ip_local_port_range', \n    'net.ipv4.ip_unprivileged_port_start', \n    'net.ipv4.tcp_syncookies',\
      \ \n    'net.ipv4.ping_group_range'\n  ]\n)"
    messageExpression: "'Setting additional sysctls above the allowed type is disallowed. Invalid sysctls\
      \ found: ' +  object.spec.?securityContext.?sysctls.orValue([]).filter(s, !(s.name in [\n  'kernel.shm_rmid_forced',\
      \ \n  'net.ipv4.ip_local_port_range', \n  'net.ipv4.ip_unprivileged_port_start', \n  'net.ipv4.tcp_syncookies',\
      \ \n  'net.ipv4.ping_group_range'\n])).map(s, s.name).join(', ')"
