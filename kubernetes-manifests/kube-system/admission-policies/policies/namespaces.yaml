apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-delete-annotation-ns-label
  annotations:
    policies.kyverno.io/title: Require delete annotation to be present before deleting namespace
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, Annotation
    policies.kyverno.io/description: 'Require namespaces to be annotated with ''homelab/delete-allowed:
      "true"'' in order to allow deletion.'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - DELETE
      resources:
      - namespaces
  matchConditions:
  - name: exclude-kube-system
    expression: oldObject.metadata.name != 'kube-system'
  validations:
  - expression: '''homelab/delete-allowed'' in oldObject.metadata.?annotations.orValue({}) && oldObject.metadata.annotations[''homelab/delete-allowed'']
      == ''true'''
    messageExpression: '''Namespace "'' + oldObject.metadata.name + ''" must be annotated with: homelab/delete-allowed:
      "true" to be deleted'''
