apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-or-operator
spec:
  policyName: disallow-or-operator
  validationActions:
  - Audit
  matchResources:
    resourceRules:
    - apiGroups:
      - traefik.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingressroutes
      - ingressroutetcps
---
