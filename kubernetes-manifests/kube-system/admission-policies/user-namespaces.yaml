apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: enforce-user-namespaces
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-host-namespaces
      expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork ||
          has(object.spec.hostPID) && object.spec.hostPID ||
          has(object.spec.hostIPC) && object.spec.hostIPC)
    - name: exclude-hostpath-volumes
      expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath))
    - name: exclude-direct-nfs-volumes
      expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, has(v.nfs))
    # NFS does not support idmap mounts, so pods that mount nfs-client PVCs
    # opt out with this label until the storage moves to Longhorn.
    - name: exclude-nfs-workloads
      expression: >-
        !has(object.metadata.labels) ||
        !('homelab/user-namespaces' in object.metadata.labels) ||
        object.metadata.labels['homelab/user-namespaces'] != 'disabled'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{hostUsers: false}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: enforce-user-namespaces
spec:
  policyName: enforce-user-namespaces
