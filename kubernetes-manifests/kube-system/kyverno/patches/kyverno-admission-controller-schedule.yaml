# Prefer the control plane so Kyverno stays close to the API server, but allow
# the second replica to run on a worker. Required pod anti-affinity keeps the
# replicas on separate nodes so a node drain cannot take both down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: admission-controller
                  app.kubernetes.io/instance: kyverno
                  app.kubernetes.io/part-of: kyverno
              topologyKey: kubernetes.io/hostname
