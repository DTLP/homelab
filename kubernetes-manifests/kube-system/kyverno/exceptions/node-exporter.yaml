apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter
  namespace: kube-system
spec:
  policyRefs:
    - name: restrict-scheduling-to-master-nodes
      kind: ValidatingPolicy
  matchConditions:
    - name: node-exporter
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        'app' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['app'] == 'node-exporter'
