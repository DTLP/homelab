apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: promtail
  namespace: kube-system
spec:
  policyRefs:
    - name: restrict-scheduling-to-master-nodes
      kind: ValidatingPolicy
    - name: hostpath-vols
      kind: ValidatingPolicy
  matchConditions:
    - name: promtail
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        'app.kubernetes.io/name' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['app.kubernetes.io/name'] == 'promtail'
