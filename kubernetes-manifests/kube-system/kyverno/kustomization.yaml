apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

resources:
  - upstream/install.yaml
  - patches/kyverno-admission-controller-pdb.yaml
  - patches/kyverno-background-controller-clusterrole.yaml
  - policies/

patches:
  - path: patches/remove-namespace.yaml
  - path: patches/kyverno-admission-controller-args.yaml
  - path: patches/kyverno-admission-controller-master-schedule.yaml
  - path: patches/kyverno-admission-controller-replicas.yaml
  - path: patches/kyverno-background-controller-args.yaml
  - path: patches/kyverno-background-controller-resources.yaml
  - path: patches/kyverno-cleanup-controller-args.yaml
  - path: patches/kyverno-config.yaml
  - path: patches/kyverno-reports-controller-args.yaml
  - path: patches/kyverno-reports-controller-resources.yaml
  - path: patches/kyverno-services.yaml
  # Patch cleanup-controller to allow access to secret names generated for
  # kube-system namespace, since we deploy Kyverno there.
  - patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - ''
          resources:
            - secrets
          verbs:
            - delete
            - get
            - list
            - update
            - watch
          resourceNames:
            - kyverno-cleanup-controller.kube-system.svc.kyverno-tls-ca
            - kyverno-cleanup-controller.kube-system.svc.kyverno-tls-pair
    target:
      kind: Role
      name: kyverno:cleanup-controller

  # empty labels and annotations added in upstream crd
  # empty label field is causing issue with ArgoCD sync
  # apiVersion: apiextensions.k8s.io/v1
  # kind: CustomResourceDefinition
  # metadata:
  #   labels:
  #     {}
  #   annotations:
  #     {}
  #   name: imagevalidatingpolicies.policies.kyverno.io
  - patch: |-
      - op: remove
        path: /metadata/labels
    target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
