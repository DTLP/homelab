apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flux-system
spec:
  project: main
  source:
    repoURL: git@github.com:DTLP/homelab.git
    targetRevision: main
    path: kubernetes-manifests/flux-system
  destination:
    name: in-cluster
    namespace: flux-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
