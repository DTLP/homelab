apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flux-system
spec:
  project: main
  source:
    repoURL: git@github.com:DTLP/homelab.git
    targetRevision: main
    path: kubernetes-manifests/flux-system
  destination:
    name: in-cluster
    namespace: flux-system
  ignoreDifferences:
    # 1000m and 1 are the same quantity, but the API server keeps the form it
    # was given, so the upstream manifests always look different.
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].resources.limits.cpu
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
