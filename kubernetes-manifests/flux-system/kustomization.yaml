apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd-app.yaml
  - https://github.com/fluxcd/flux2/manifests/bases/source-controller?ref=v2.9.4
  - https://github.com/fluxcd/flux2/manifests/bases/kustomize-controller?ref=v2.9.4
  - https://github.com/fluxcd/flux2/manifests/rbac?ref=v2.9.4
  - https://github.com/fluxcd/flux2/manifests/policies?ref=v2.9.4

  - git-repos.yaml
  - network-policies.yaml

patches:
  - target:
      group: apps
      kind: Deployment
      name: (kustomize|source)-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
  - target:
      group: apps
      kind: Deployment
      name: kustomize-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 10m
                    memory: 112Mi
                  limits:
                    cpu: 50m
                    memory: 224Mi
  # The upstream Flux policy bundle allows all egress and allows scraping from
  # every namespace. Remove those so the namespace policies in this directory
  # are the only ones in effect.
  - target:
      kind: NetworkPolicy
      name: allow-egress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-egress
  - target:
      kind: NetworkPolicy
      name: allow-scraping
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-scraping
