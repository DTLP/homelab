apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: private-ingress.dtlp.cc
spec:
  entryPoints:
    - web-secure
  routes:
    - kind: Rule
      match: Host(`private-ingress.dtlp.cc`) && PathPrefix(`/dashboard`)
      middlewares:
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
    - kind: Rule
      match: Host(`private-ingress.dtlp.cc`) && PathPrefix(`/api`)
      middlewares:
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
    - kind: Rule
      match: Host(`traefik.dtlp.cc`) && PathPrefix(`/dashboard`)
      middlewares:
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
    - kind: Rule
      match: Host(`traefik.dtlp.cc`) && PathPrefix(`/api`)
      middlewares:
        - name: traefik-dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}
