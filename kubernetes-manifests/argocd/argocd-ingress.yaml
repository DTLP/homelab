apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  annotations:
    external-dns.alpha.kubernetes.io/target: private-ingress.dtlp.cc
spec:
  entryPoints:
    - web-secure
  routes:
    - kind: Rule
      match: Host(`argocd.dtlp.cc`)
      services:
        - name: argocd-server
          kind: Service
          port: 80
  tls: {}
