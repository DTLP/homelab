apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-app.yaml
  - argocd-ingress.yaml
  - argocd-project.yaml
  - argocd-voodoobox-plugin.yaml
  - argocd-voodoobox-rbac.yaml

  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml

patches:
  - path: argocd-cmd-params-cm-patch.yaml
  - path: argocd-server-svc-patch.yaml
  - path: argocd-repo-server-patch.yaml
  - path: disable-components-patch.yaml

secretGenerator:
  - files:
      - sshPrivateKey=secrets/github-ssh-key
    literals:
      - url=git@github.com:DTLP/homelab.git
      - project=main
      - type=git
    name: homelab-repo
    options:
      disableNameSuffixHash: true
      labels:
        argocd.argoproj.io/secret-type: repository
