apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
data:
  # The API server stamps a status into every volumeClaimTemplate, which
  # cannot be applied back, so StatefulSets would always look out of sync.
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    jqPathExpressions:
      - .spec.volumeClaimTemplates[].status
