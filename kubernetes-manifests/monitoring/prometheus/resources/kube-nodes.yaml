groups:
  - name: kube-nodes
    rules:
      - alert: HighCPUUsage
        expr: avg(rate(node_cpu_seconds_total{mode="user"}[10m])) by (instance) > 0.9
        for: 10m
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is greater than 90% for the last 10 minutes."
          impact: "High CPU usage can lead to degraded performance and slow application response times."
          action: "Investigate processes consuming high CPU. Consider scaling resources or optimizing workloads."
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        annotations:
          summary: "High Memory usage on {{ $labels.instance }}"
          description: "Memory usage exceeds 90% for the last 10 minutes."
          impact: "Performance degradation and potential service interruption."
          action: "Investigate memory usage with `top` or `htop`. Consider increasing memory resources or optimizing memory usage."
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.8
        for: 10m
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage exceeds 80% on the node."
          impact: "High disk usage can lead to performance degradation and potential data loss."
          action: "Investigate disk usage with `df` or `du`. Clear unnecessary files or expand disk capacity."
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        annotations:
          summary: "Node down: {{ $labels.instance }}"
          description: "No metrics have been received from the node for the last 5 minutes."
          impact: "A node being down can cause service disruptions or unavailability of critical infrastructure."
          action: "Check the node's status using `kubectl get nodes`. Investigate if the node is unreachable or if the node-exporter pod is not running."
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 10m
        annotations:
          summary: "Node Not Ready: {{ $labels.node }}"
          description: "The node has been in NotReady state for the last 10 minutes."
          impact: "A NotReady node can lead to service disruptions and unavailability of workloads scheduled on it."
          action: "Check the node's status using `kubectl describe node {{ $labels.node }}`. Investigate the cause of the NotReady state."
      - alert: NodeRestartingOften
        expr: changes(node_boot_time_seconds[3h]) > 1
        annotations:
          summary: "Node {{ $labels.instance }} is restarting repeatedly"
          description: "{{ $labels.instance }} has rebooted more than once in the last 3 hours."
          impact: "Workloads are repeatedly interrupted and control-plane stability is at risk."
          action: "Check the boot history in `/var/log/kernel.log` and `/var/log/kernel.log.1`, for example with `talosctl -n <node> read /var/log/kernel.log`. Look for `boot sequence: failed` and for a service stuck in `Waiting` during startup."
      # MemAvailable can stay above the kubelet eviction threshold while the node
      # is already stalling on reclaim. PSI catches that case.
      - alert: NodeMemoryPressure
        expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.1
        for: 10m
        annotations:
          summary: "Memory pressure on {{ $labels.instance }}"
          description: "The node spent more than 10% of the last 5 minutes stalled on memory."
          impact: "Kubelet, the container runtime and workloads can miss health checks and restart."
          action: "Check memory usage and pod placement on the node. Rebalance pods and look for a workload that grew unexpectedly."
      - alert: NodeMemoryAvailableLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 20
        for: 10m
        annotations:
          summary: "Low available memory on {{ $labels.instance }}"
          description: "Less than 20% of memory has been available for the last 10 minutes."
          impact: "The node is close to memory reclaim or the OOM killer."
          action: "Check memory usage and pod placement. Rebalance pods or increase the node size."
      - alert: NodeMemoryRequestSaturation
        expr: |
          sum by (node) (kube_pod_container_resource_requests{resource="memory"})
          /
          sum by (node) (kube_node_status_allocatable{resource="memory"}) > 0.8
        for: 10m
        annotations:
          summary: "Memory requests are above 80% on {{ $labels.node }}"
          description: "Pods request more than 80% of the node's allocatable memory."
          impact: "The scheduler has little room to place new pods, and actual usage can exceed requests."
          action: "Spread workloads across nodes and review the requests for the largest pods."
      - alert: PodDistributionSkew
        expr: |
          max(count by (node) (kube_pod_info{node!="master-0"}))
          >
          2 * avg(count by (node) (kube_pod_info{node!="master-0"}))
        for: 30m
        annotations:
          summary: "Pods are concentrated on one node"
          description: "One worker has more than twice the average number of pods."
          impact: "A single node failure or memory pressure affects a large part of the cluster."
          action: "Check `kubectl get pods -A -o wide` and rebalance with the descheduler or by restarting single-replica workloads."
