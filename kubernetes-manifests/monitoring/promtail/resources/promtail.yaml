server:
  log_level: info
  log_format: logfmt
  http_listen_port: 3101

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /run/promtail/positions.yaml

scrape_configs:
  # See also https://github.com/grafana/loki/blob/master/production/ksonnet/promtail/scrape_config.libsonnet for reference
  - job_name: kubernetes-pods
    pipeline_stages:
      - cri: {}
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_controller_name
        regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
        action: replace
        target_label: __tmp_controller_name
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
          - __meta_kubernetes_pod_label_app
          - __tmp_controller_name
          - __meta_kubernetes_pod_name
        regex: ^;*([^;]+)(;.*)?$
        action: replace
        target_label: app
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_component
          - __meta_kubernetes_pod_label_component
        regex: ^;*([^;]+)(;.*)?$
        action: replace
        target_label: component
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node_name
      - action: replace
        source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
      - action: replace
        replacement: /var/log/pods/*$1/*.log
        separator: /
        source_labels:
        - __meta_kubernetes_pod_uid
        - __meta_kubernetes_pod_container_name
        target_label: __path__
      - action: replace
        regex: true/(.*)
        replacement: /var/log/pods/*$1/*.log
        separator: /
        source_labels:
        - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
        - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
        - __meta_kubernetes_pod_container_name
        target_label: __path__

  # Talos host/systemd service logs. Each system service writes to its own
  # /var/log/<service>.log file. Targets are listed explicitly (a single glob
  # would prevent per-service labels: promtail relabels __path__ before the
  # glob is expanded).
  - job_name: host-logs
    static_configs:
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/apid.log
          service_name: apid
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/auditd.log
          service_name: auditd
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/containerd.log
          service_name: containerd
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/controller-runtime.log
          service_name: controller-runtime
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/cri.log
          service_name: cri
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/dashboard.log
          service_name: dashboard
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/dns-resolve-cache.log
          service_name: dns-resolve-cache
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/early-startup.log
          service_name: early-startup
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/etcd.log
          service_name: etcd
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/kernel.log
          service_name: kernel
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/kubelet.log
          service_name: kubelet
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/machined.log
          service_name: machined
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/syslogd.log
          service_name: syslogd
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/trustd.log
          service_name: trustd
      - targets:
          - localhost
        labels:
          hostname: ${HOSTNAME}
          __path__: /var/log/udevd.log
          service_name: udevd

limits_config:

tracing:
  enabled: false
