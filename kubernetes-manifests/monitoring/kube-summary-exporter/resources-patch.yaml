apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-summary-exporter
spec:
  template:
    spec:
      containers:
        - name: kube-summary-exporter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 48Mi
          readinessProbe:
            tcpSocket:
              port: 9779
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9779
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault