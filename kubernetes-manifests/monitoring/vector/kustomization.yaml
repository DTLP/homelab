apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - daemonset.yaml
  - serviceaccount.yaml

configMapGenerator:
  - name: vector
    files:
      - global.yaml=resources/global.yaml
      - host.yaml=resources/host.yaml
      - metrics.yaml=resources/metrics.yaml
      - pods.yaml=resources/pods.yaml
