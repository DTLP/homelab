apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app.kubernetes.io/name: etcd
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2381
      protocol: TCP
      targetPort: 2381
---
apiVersion: v1
kind: Endpoints
metadata:
  name: etcd
  labels:
    app.kubernetes.io/name: etcd
subsets:
  - addresses:
      - ip: 192.168.0.30
    ports:
      - name: metrics
        port: 2381
        protocol: TCP