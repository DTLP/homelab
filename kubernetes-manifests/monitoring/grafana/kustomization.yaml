apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana.yaml
  - grafana-pvc.yaml
  - grafana-clusterrole.yaml
  - grafana-ingress.yaml
  - grafana-rbac.yaml
  - grafana-role.yaml
  - grafana-service.yaml

  - terraform-modules/

configMapGenerator:
  - name: grafana
    files:
      - resources/grafana.ini
  - name: grafana-datasources
    files:
      - resources/datasources.yaml
  - name: grafana-tf-applier-token-provision
    files:
      - resources/grafana-tf-applier-token-provision.sh

secretGenerator:
  - name: grafana
    envs:
      - secrets/grafana
    options:
      disableNameSuffixHash: true
  - name: hcp-terraform
    envs:
      - secrets/hcp-terraform
    options:
      disableNameSuffixHash: true
