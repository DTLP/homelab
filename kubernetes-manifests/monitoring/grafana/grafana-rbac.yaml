# Scoped to let the grafana pod's terraform-applier-token sidecar create
# and rotate the terraform-applier-grafana-token secret. "create" can't be
# restricted by resourceNames, so it's granted namespace-wide;
# get/update/patch are restricted to the one secret the sidecar manages.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-tf-applier-token-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["terraform-applier-grafana-token"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-tf-applier-token-writer
subjects:
  - kind: ServiceAccount
    name: grafana
roleRef:
  kind: Role
  name: grafana-tf-applier-token-writer
  apiGroup: rbac.authorization.k8s.io
