# Kept after the move to the Alertmanager StatefulSet. The StatefulSet creates
# per-replica PVCs; this one still holds the old notification log.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
