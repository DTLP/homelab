global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/template.tmpl'

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack'

receivers:
- name: 'slack'
  slack_configs:
  - channel: '#alerts'
    api_url: 'https://slack.com/api/chat.postMessage'
    http_config:
      authorization:
        type: Bearer
        credentials_file: /etc/secrets/slack
    # Slack collapses attachment text beyond 5 lines or ~700 characters behind
    # "Show more". Field values are not collapsed, so the body lives in a
    # full-width field. The attachment title keeps the summary at the top, its
    # default title_link makes it clickable, and the attachment renders the
    # status colour bar.
    title: '{{ template "title" . }}'
    text: '{{ "" }}'
    fields:
      - title: '{{ "" }}'
        value: '{{ template "body" . }}'
        short: false
    send_resolved: true
    update_message: true
