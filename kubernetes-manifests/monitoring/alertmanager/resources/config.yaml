global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/template.tmpl'

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack'

receivers:
- name: 'slack'
  slack_configs:
  - channel: '#alerts'
    api_url: 'https://slack.com/api/chat.postMessage'
    http_config:
      authorization:
        type: Bearer
        credentials_file: /etc/secrets/slack
    title: '{{ template "title" . }}'
    message_text: '{{ template "body" . }}'
    send_resolved: true
    update_message: true
