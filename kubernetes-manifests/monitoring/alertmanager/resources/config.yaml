global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/template.tmpl'

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack'

receivers:
- name: 'slack'
  slack_configs:
  - channel: '#alerts'
    api_url: 'https://slack.com/api/chat.postMessage'
    http_config:
      authorization:
        type: Bearer
        credentials_file: /etc/secrets/slack
    # Slack renders the top-level text (message_text) above the attachment and
    # the attachment title below it. Keep the summary in the top-level text so
    # the title stays at the top of the message, and leave the attachment title
    # empty. The body remains in the attachment text below the title.
    title: '{{ "" }}'
    message_text: '{{ template "headline" . }}'
    text: '{{ template "body" . }}'
    send_resolved: true
    update_message: true
