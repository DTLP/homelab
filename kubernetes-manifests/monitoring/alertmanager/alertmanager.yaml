apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  # A single replica owns the notification log on the RWO volume, so never run
  # two pods against it during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.34.0
        args:
          - "--config.file=/etc/alertmanager/config.yaml"
          # Snapshot the notification log often, otherwise a restart can
          # resend alerts that were already notified.
          - "--data.maintenance-interval=1m"
          - "--storage.path=/alertmanager"
          - "--web.external-url=https://alertmanager.dtlp.cc"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/config.yaml
          subPath: config.yaml
        - name: template
          mountPath: /etc/alertmanager/template.tmpl
          subPath: template.tmpl
        - name: slack
          mountPath: /etc/secrets/slack
          subPath: slack
        - name: data
          mountPath: /alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: template
        configMap:
          name: alertmanager-template
      - name: slack
        secret:
          secretName: slack
      - name: data
        persistentVolumeClaim:
          claimName: alertmanager-data
