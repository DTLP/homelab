apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  # A single replica owns the notification log on the RWO volume, so do not
  # surge: the old pod must terminate before the new one starts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c # v0.35.0
        args:
          - "--config.file=/etc/alertmanager/config.yaml"
          # Snapshot the notification log often, otherwise a restart can
          # resend alerts that were already notified.
          - "--data.maintenance-interval=1m"
          - "--storage.path=/alertmanager"
          - "--web.external-url=https://alertmanager.dtlp.cc"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/config.yaml
          subPath: config.yaml
        - name: template
          mountPath: /etc/alertmanager/template.tmpl
          subPath: template.tmpl
        - name: slack
          mountPath: /etc/secrets/slack
          subPath: slack
        - name: data
          mountPath: /alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: template
        configMap:
          name: alertmanager-template
      - name: slack
        secret:
          secretName: slack
      - name: data
        persistentVolumeClaim:
          claimName: alertmanager-data
