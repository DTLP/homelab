apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
spec:
  serviceName: alertmanager-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      # Keep the two replicas on separate nodes so a single node cannot take
      # both Alertmanagers down at once.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: alertmanager
              topologyKey: kubernetes.io/hostname
      containers:
      - name: alertmanager
        image: prom/alertmanager@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c # v0.35.0
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        args:
          - "--config.file=/etc/alertmanager/config.yaml"
          # Snapshot the notification log often, otherwise a restart can
          # resend alerts that were already notified.
          - "--data.maintenance-interval=1m"
          - "--storage.path=/alertmanager"
          - "--web.external-url=https://alertmanager.dtlp.cc"
          - "--cluster.listen-address=0.0.0.0:9094"
          - "--cluster.advertise-address=$(POD_IP):9094"
          - "--cluster.peer=alertmanager-0.alertmanager-headless.monitoring.svc.cluster.local:9094"
          - "--cluster.peer=alertmanager-1.alertmanager-headless.monitoring.svc.cluster.local:9094"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: web
          containerPort: 9093
        - name: cluster
          containerPort: 9094
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/config.yaml
          subPath: config.yaml
        - name: template
          mountPath: /etc/alertmanager/template.tmpl
          subPath: template.tmpl
        - name: slack
          mountPath: /etc/secrets/slack
          subPath: slack
        - name: data
          mountPath: /alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: template
        configMap:
          name: alertmanager-template
      - name: slack
        secret:
          secretName: slack
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn
