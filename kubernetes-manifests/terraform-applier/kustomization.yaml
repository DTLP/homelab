apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-app.yaml
  - tf-applier-ingress.yaml

  - github.com/utilitywarehouse/terraform-applier//manifests/base/namespaced?ref=v2.6.1

patches:
  - path: tf-applier-patch.yaml
  - path: tf-applier-service-patch.yaml
  - path: tf-applier-redis-patch.yaml

configMapGenerator:
  - name: tf-applier-config
    files:
      - resources/config.yaml
