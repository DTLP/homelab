apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-browser
  annotations:
    external-dns.alpha.kubernetes.io/target: private-ingress.dtlp.cc
spec:
  rules:
    - host: registry-browser.dtlp.cc
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-browser
spec:
  entryPoints:
    - web-secure
  routes:
    - kind: Rule
      match: Host(`registry-browser.dtlp.cc`)
      middlewares:
        - name: registry-browser-auth
      services:
        - name: registry-browser
          kind: Service
          port: 8080
  tls: {}
