apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller
    - from:
        - podSelector:
            matchLabels:
              app: registry-mirror-browser
    - from:
        - podSelector:
            matchLabels:
              app: registry-browser
  egress:
    - {}