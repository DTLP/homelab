apiVersion: v1
kind: Service
metadata:
  name: registry-browser
  labels:
    app: registry-browser
spec:
  selector:
    app: registry-browser
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-browser
  labels:
    app: registry-browser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-browser
  template:
    metadata:
      labels:
        app: registry-browser
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser
          image: klausmeyer/docker-registry-browser:1.10.3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: SECRET_KEY_BASE
            - name: DOCKER_REGISTRY_URL
              value: http://registry.registry.svc.cluster.local:5000
            - name: PUBLIC_REGISTRY_URL
              value: registry.dtlp.cc
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: admin-user
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: admin-password
            - name: ENABLE_DELETE_IMAGES
              value: "true"
            - name: TZ
              value: Europe/London
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
