apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-mirror
  annotations:
    external-dns.alpha.kubernetes.io/target: private-ingress.dtlp.cc
spec:
  rules:
    - host: registry.dtlp.cc
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-mirror
spec:
  entryPoints:
    - web-secure
  routes:
    - kind: Rule
      match: Host(`registry.dtlp.cc`)
      services:
        - name: registry-mirror
          kind: Service
          port: 5000
  tls: {}