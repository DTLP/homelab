apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  annotations:
    external-dns.alpha.kubernetes.io/target: private-ingress.dtlp.cc
spec:
  entryPoints:
    - web-secure
  routes:
    - kind: Rule
      match: Host(`longhorn.dtlp.cc`)
      middlewares:
        - name: longhorn-auth
      services:
        - name: longhorn-frontend
          kind: Service
          port: 80
  tls: {}
