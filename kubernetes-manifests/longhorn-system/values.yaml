global:
  nodeSelector:
    longhorn.io/storage: "true"

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Delete

longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

longhornUI:
  replicas: 1
  ingress:
    enabled: false
