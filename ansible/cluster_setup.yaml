---
- name: Setup Proxmox Cluster
  hosts: pve_nodes
  become: true
  any_errors_fatal: true
  vars:
    # The initial connection falls back to the root password until ssh_setup.yaml
    # has installed the SSH keys. pvecm prompts for the same password when a
    # node joins, so the password stays available to the play as well.
    root_password: "{{ lookup('file', 'secrets/root_password') }}"
    ansible_ssh_pass: "{{ root_password }}"

  tasks:
    - name: Check whether the node already belongs to a cluster
      stat:
        path: /etc/pve/corosync.conf
      register: corosync_conf

    - name: Setup cluster on main node
      command: pvecm create {{ cluster_name }}
      when:
        - ansible_host == main_node_ip
        - not corosync_conf.stat.exists

    - name: Look for Enterprise repository files
      stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/sources.list.d/pve-enterprise.list
      register: enterprise_repos

    - name: Comment out Enterprise repositories
      lineinfile:
        path: "{{ item.item }}"
        regexp: '^(deb(?!.*download\.proxmox\.com).*)$'
        line: '#\1'
        backrefs: yes
      loop: "{{ enterprise_repos.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Add the community repo to pve-enterprise.list
      lineinfile:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        line: 'deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription'
        create: yes
        state: present

    - name: Update the apt cache
      apt:
        update_cache: yes

    - name: Ensure `pexpect` is installed
      apt:
        name: python3-pexpect
        state: present
      when:
        - ansible_host != main_node_ip
        - not corosync_conf.stat.exists

    - name: Join other nodes to the cluster using root password
      expect:
        command: "pvecm add {{ main_node_ip }}"
        responses:
          (?m)^Please enter superuser .* password for .*: "{{ root_password }}"
          (?m)^Are you sure you want to continue connecting: "yes"
      when:
        - ansible_host != main_node_ip
        - not corosync_conf.stat.exists

    - name: Display cluster status
      command: pvecm status
      register: cluster_status
      changed_when: false

    - name: Print cluster status
      debug:
        var: cluster_status.stdout

- name: Set the CPU frequency governor to schedutil
  hosts: pve_nodes
  become: true

  vars:
    cpu_governor: schedutil

  tasks:
    - name: Check that the governor is available
      command: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
      register: available_governors
      changed_when: false
      check_mode: false

    - name: Fail when the governor is not available
      assert:
        that: cpu_governor in available_governors.stdout
        fail_msg: "{{ cpu_governor }} is not offered by the kernel"

    - name: Persist the governor across reboots
      copy:
        dest: /etc/systemd/system/cpu-governor.service
        mode: "0644"
        content: |
          [Unit]
          Description=Set the CPU frequency governor to {{ cpu_governor }}
          After=multi-user.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'for c in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo {{ cpu_governor }} > "$c"; done'

          [Install]
          WantedBy=multi-user.target
      register: cpu_governor_unit

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: cpu_governor_unit.changed

    - name: Apply the governor now and enable the unit
      systemd:
        name: cpu-governor.service
        enabled: yes
        state: started
